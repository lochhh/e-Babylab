services:
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/static:ro
      - ./media:/app/media:ro
      - ./webcam:/app/webcam:ro
      - ./reports:/app/reports:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SSL_CERT_PATH}:/etc/ssl/certs/cert.pem:ro
      - ${SSL_KEY_PATH}:/etc/ssl/private/server.key:ro
    environment:
      - DOMAIN=${DOMAIN}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    depends_on:
      - web
    restart: always
  db:
    image: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    env_file: ./.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
  web:
    image: ghcr.io/lochhh/e-babylab:latest
    # To build from source instead of pulling the pre-built image, uncomment:
    # build:
    #   context: .
    #   target: prod
    depends_on:
      - db
    volumes:
      - static_volume:/usr/src/app/static
      - ./media:/usr/src/app/media
      - ./webcam:/usr/src/app/webcam
      - ./reports:/usr/src/app/reports
    env_file: ./.env
    environment:
      - DJANGO_ENV=prod
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    restart: always

volumes:
  postgres_data:
  static_volume:
