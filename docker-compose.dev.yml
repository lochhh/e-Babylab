services:
  db:
    image: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    env_file: ./.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    restart: always
  web:
    build:
      context: .
      args:
        BUILD_MODE: "dev"
    image: ipl:latest
    volumes:
      - ./src:/usr/src/app # Mount source code for live reload
      - venv_cache:/usr/src/app/.venv # Preserve virtual environment
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: "sh -c 'chmod +x ./wait-for-it.sh && ./wait-for-it.sh db:5432 -- python manage.py runserver 0:8080'"
    env_file: ./.env
    environment:
      - DJANGO_ENV=dev
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    restart: always
  pgadmin:
    image: dpage/pgadmin4
    env_file: ./.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - db
    ports:
      - "5050:80"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

volumes:
  venv_cache:
  postgres_data_dev:
