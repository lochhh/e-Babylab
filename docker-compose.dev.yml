services:
  db:
    image: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: always
  web:
    build:
      context: .
      args:
        BUILD_MODE: "dev"
    image: ipl:latest
    volumes:
      - ./ipl:/usr/src/app # Mount source code for live reload
      - venv_cache:/usr/src/app/.venv # Preserve virtual environment
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: "sh -c 'chmod +x ./wait-for-it.sh && ./wait-for-it.sh db:5432 -- python manage.py runserver 0:8080'"
    environment:
      - DJANGO_ENV=dev
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
    restart: always
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@domain.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    depends_on:
      - db
    ports:
      - "80"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

volumes:
  venv_cache:
  postgres_data_dev:
