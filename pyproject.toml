[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-Babylab"
version = "2.0.0.a1"
description = "An open-source browser-based tool for unmoderated online developmental studies"
authors = [
	{ name = "Chang Huan Lo" }
]
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
	"django>=6.0",
	"psycopg2-binary",
	"django-colorfield",
	"xlsxwriter",
	"gunicorn; sys_platform != 'win32'",
	"python-dateutil",
	"pillow",
	"django-grappelli>=5.0.0",
	"django-filer>=3.4.4",
	"django-tinymce",
	"scipy",
	"numpy",
	"pandas>=3.0",
	"catsim>=0.17.1",
	"numexpr>=2.8.3",
	"tqdm>=4.64.0",
	"requests",
]

[tool.ruff]
exclude = ["__init__.py", "migrations"]
fix=true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "T20", "SIM", "Q", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D205"] # missing-blank-line-after-summary
"**/template_defaults.py" = ["E501"] # line-too-long (HTML template strings)
"**/migrations/*.py" = ["D"] # auto-generated files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
	{include-group = "docs"},
	"pytest",
	"pytest-cov",
	"pytest-django",
	"pytest-mock",
	"coverage",
	"mypy",
	"pre-commit",
	"ruff",
	"setuptools_scm",
	"pandas-stubs",
	"types-requests",
]
docs = [
	"myst-parser[linkify]",
	"nbsphinx",
	"pydata-sphinx-theme",
	"sphinx",
	"sphinx-autodoc-typehints",
	"sphinx-design",
	"sphinxcontrib-mermaid",
	"sphinxcontrib-youtube",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
addopts = [
    "--cov=experiments",
    "--cov=config",
    "--cov-report=term-missing",
    "--ds=config.settings",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/experiments/management/*",
    "*/experiments/migrations/*",
]