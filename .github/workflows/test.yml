name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.10", "3.9"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-test.txt
      
      - name: Create .env file for tests
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci-only" > ipl/.env
          echo "GOOGLE_RECAPTCHA_SITE_KEY=test-site-key" >> ipl/.env
          echo "GOOGLE_RECAPTCHA_SECRET_KEY=test-secret-key" >> ipl/.env
      
      - name: Run tests with coverage
        working-directory: ipl
        env:
          DJANGO_TEST_DATABASE: sqlite
          SECRET_KEY: test-secret-key-for-ci-only
          GOOGLE_RECAPTCHA_SITE_KEY: test-site-key
          GOOGLE_RECAPTCHA_SECRET_KEY: test-secret-key
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./ipl/coverage.xml
          fail_ci_if_error: false
          verbose: true
