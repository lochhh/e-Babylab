name: Build and publish docs

# Generate the documentation on all pushes to main, all pull requests, or by
# manual workflow dispatch. The build job can be used as a CI check that the
# docs still build successfully. The deploy job which moves the generated
# html to the gh-pages branch and triggers a GitHub pages deployment
# only runs when a tag is pushed or when the workflow is manually dispatched.

on:
  push:
    branches:
      - add-docs
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Cancel any in-progress runs if a new run is triggered for the same ref,
# except for tags and main branch pushes.
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run -- bash -c "cd docs && make html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch')
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write    # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
